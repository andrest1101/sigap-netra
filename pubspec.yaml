name: sigap_netra_app
description: "Aplikasi pendamping kacamata pintar SIGAP-NETRA untuk membantu tunanetra mengenali uang dan teks."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.8.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.0.0
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  equatable: ^2.1.0
  qr_flutter: ^4.1.0
  share_plus: ^12.0.2
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0
  mocktail: ^1.0.5
  firebase_auth_mocks: ^0.15.2
  # Tool build-time cangkang native (ikon launcher & splash). Dipakai lewat
  # `dart run`, tidak ikut ke runtime aplikasi.
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Generates the localization delegates from lib/l10n/app_id.arb. Every
  # user-facing string in a widget must come from that file.
  generate: true

  # Logo merek SIGAP-NETRA (mark mata + gelombang sinyal) sudah dipangkas dan
  # dioptimalkan dari sumber logo.jpeg; lihat lib/core/widgets/logo_mark.dart.
  # Logo merek pihak ketiga (Google "G") tidak tersedia sebagai ikon
  # Material, jadi di-bundle sebagai PNG transparan 1x.
  # Foto dummy demonstrasi (bukan hasil bacaan alat): JPEG ≤ 60 KB sesuai
  # batas thumbnail privasi, dipakai FakeMediaDataSource untuk det-money-100k.
  assets:
    - assets/images/logo_mark.png
    - assets/images/google_g_logo.png
    - assets/images/demo_money_100k.jpg
    - assets/images/demo_money_50k.jpg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Plus Jakarta Sans (OFL) di-bundle sebagai asset; tanpa unduhan runtime.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700

# ---------------------------------------------------------------------------
# Ikon launcher & splash native — konfigurasi build-time (tidak ikut runtime).
# Aset sumber di assets/branding/ dihasilkan oleh tool/generate_branding_icons.ps1;
# jalankan ulang tool di bawah ini setiap kali aset berubah.
# ---------------------------------------------------------------------------

# Ikon launcher: adaptive icon Android + ikon iOS/legacy. Regenerasi:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/app_icon.png"
  adaptive_icon_background: "#FFFDFB"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  # Aset foreground sudah dihitung terhadap safe zone adaptive icon (66/108 dp)
  # oleh tool/generate_branding_icons.ps1 — tanpa inset tambahan dari tool.
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true

# Splash native: latar `BrandColors.background` (#F6F6FB) + cakram logo, senada
# splash dalam-app supaya transisi tidak berkedip. Varian gelap disetel sama —
# aplikasi terang-saja (keputusan produk 2026-10-18). Regenerasi:
#   dart run flutter_native_splash:create
flutter_native_splash:
  android: true
  ios: true
  web: false
  color: "#F6F6FB"
  image: assets/branding/splash_logo.png
  color_dark: "#F6F6FB"
  image_dark: assets/branding/splash_logo.png
  android_12:
    color: "#F6F6FB"
    color_dark: "#F6F6FB"
    icon_background_color: "#FFFFFF"
    icon_background_color_dark: "#FFFFFF"




